name: Release

# Publishes pnpm11-ci-guard to npm with provenance when a v* tag is pushed.
#
# id-token: write is what makes --provenance work. npm rejects the flag without
# it, and the permission is never granted by default.
#
# Needs an NPM_TOKEN secret (automation token). A missing credential must fail
# publication rather than report a successful release that is absent from npm.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      # The bundle is committed and runs directly on consumers' runners, so it
      # gets a signed provenance statement. Verify with:
      #   gh attestation verify dist/<file> --repo Booyaka101/pnpm11-ci-guard
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "pnpm11-ci-guard@$VERSION" version >/dev/null 2>&1; then
            echo "pnpm11-ci-guard@$VERSION is already on the registry, nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
              echo "::error::NPM_TOKEN is missing; pnpm11-ci-guard@$VERSION was not published."
              echo "Publication failed: NPM_TOKEN is missing. Build and tests alone do not complete a release." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            npm publish --provenance --access public
            for attempt in $(seq 1 12); do
              if npm view "pnpm11-ci-guard@$VERSION" version >/dev/null 2>&1; then
                echo "Published and verified pnpm11-ci-guard@$VERSION with provenance." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              sleep 10
            done
            echo "::error::npm accepted publication, but pnpm11-ci-guard@$VERSION is not publicly available yet."
            exit 1
          fi
